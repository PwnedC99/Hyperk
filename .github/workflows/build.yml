name: ESP32-S3FH4R2 Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Host tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify pinned backend UI
        run: python scripts/check_backend_ui.py --output "${{ runner.temp }}/hyperk-ui"
      - name: Browser integration tests
        env:
          HYPERK_BACKEND_FIXTURES: ${{ runner.temp }}/hyperk-ui
        run: npm test

  build:
    needs: tests
    name: ESP32-S3FH4R2
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO - ESP32-S3FH4R2
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            .ccache/esp32s3-fh4r2
          key: pio-esp32s3-fh4r2-${{ hashFiles('platformio.ini', 'requirements-build.txt', 'resources/backend_checksums.json') }}
          restore-keys: |
            pio-esp32s3-fh4r2-

      - name: Install PlatformIO + esptool + ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Verify resolved USB CDC configuration
        run: python tests/test_usb_config.py

      - name: Build ESP32-S3FH4R2 defaults
        run: pio run -j 2 -e esp32s3-fh4r2

      - name: Configuration storage fault tests
        run: python tests/test_config_store.py

      - name: Build ESP32-S3FH4R2 with WiFi tuning
        env:
          PLATFORMIO_BUILD_SRC_FLAGS: '-DWIFI_TX_POWER_DBM=17.0 -DWIFI_LOW_LATENCY=1'
        run: pio run -j 2 -e esp32s3-fh4r2

      - name: Build isolated USB configuration diagnostics
        run: pio run -j 2 -e esp32s3-fh4r2-diagnostic

      - name: Upload ESP32-S3FH4R2 firmware
        uses: actions/upload-artifact@v7
        with:
          name: Hyperk-Firmware-esp32s3-fh4r2
          path: release/
          if-no-files-found: error

      - name: Generate Job Summary
        run: echo '**Board:** ESP32-S3FH4R2 (esp32s3-fh4r2), default and WiFi-tuned variants' >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Hyperk-Firmware-*
          path: release
          merge-multiple: true

      - name: Create Pre-release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
