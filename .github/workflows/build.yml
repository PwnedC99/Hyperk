name: PlatformIO Build All

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Host tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify pinned backend UI
        run: python scripts/check_backend_ui.py --output "${{ runner.temp }}/hyperk-ui"
      - name: Browser integration tests
        env:
          HYPERK_BACKEND_FIXTURES: ${{ runner.temp }}/hyperk-ui
        run: npm test

  build:
    needs: tests
    name: "${{ matrix.group }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - group: ModernESP_C2
            boards: "esp32c2"
            cache_extra: ".pio"
          - group: ModernESP_C3_C5_C6
            boards: "esp32c3 esp32c5 esp32c6"
            cache_extra: ""
          - group: ModernESP_S2
            boards: "esp32s2"
            cache_extra: ""
          - group: ModernESP_S3
            boards: "esp32s3 esp32s3-fh4r2"
            cache_extra: ""
          - group: ModernESP_S3_tuned
            boards: "esp32s3-fh4r2"
            build_src_flags: "-DWIFI_TX_POWER_DBM=17.0 -DWIFI_LOW_LATENCY=1"
            cache_extra: ""
          - group: ClassicESP
            boards: "esp32 esp32-eth01 esp8266"
            cache_extra: ""
          - group: CustomBoards
            boards: "esp32-GLEDOPTO_GL_C_616WL esp32-GLEDOPTO_GL_C_615WL esp32-DOMRAEM_WLE_ADM esp32-IOTORERO_ETHERNET"
            cache_extra: "" 
          - group: Pico
            boards: "pico pico2"
            cache_extra: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: "Cache PlatformIO - ${{ matrix.group }}"
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            .ccache
            ${{ matrix.cache_extra }}
          key: pio-${{ matrix.group }}-${{ hashFiles('platformio.ini', 'requirements-build.txt', 'resources/backend_checksums.json') }}
          restore-keys: |
            pio-${{ matrix.group }}-

      - name: Install PlatformIO + esptool + ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build ${{ matrix.group }}
        env:
          PLATFORMIO_BUILD_SRC_FLAGS: ${{ matrix.build_src_flags || '' }}
        run: |
          ENVS="${{ matrix.boards }}"
          for env in $ENVS; do
            pio run -j 2 -e "$env"
          done

      - name: "Upload Artifacts - ${{ matrix.group }}"
        uses: actions/upload-artifact@v7
        with:
          name: Hyperk-Firmware-${{ matrix.group }}
          path: release/
          if-no-files-found: error

      - name: Generate Job Summary
        run: |
          echo "**Boards:** ${{ matrix.boards }}" >> $GITHUB_STEP_SUMMARY

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Hyperk-Firmware-*
          path: release
          merge-multiple: true

      - name: Create Pre-release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}